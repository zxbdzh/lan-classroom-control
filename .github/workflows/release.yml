name: Build and Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.8.10 is the last official CPython Windows build supporting Win7.
          python-version: '3.8.10'
      - uses: astral-sh/setup-uv@v6
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Install dependencies and test
        shell: pwsh
        run: |
          uv sync --locked --python "$env:pythonLocation\python.exe" --group build --group dev
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed with exit code $LASTEXITCODE" }
          uv run --locked pytest tests -q
          if ($LASTEXITCODE -ne 0) { throw "Test suite failed with exit code $LASTEXITCODE" }
      - name: Verify release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $declared = (Get-Content version.txt -Raw).Trim()
          if ($declared -ne $version) { throw "Tag version $version does not match version.txt $declared" }
      - name: Prepare pinned UltraVNC
        shell: pwsh
        run: |
          uv run --locked python scripts/prepare_ultravnc.py
          if ($LASTEXITCODE -ne 0) { throw "UltraVNC preparation failed" }
      - name: Build teacher
        shell: pwsh
        env:
          CLASSROOM_FREEZE_ROLE: LanClassroom-Teacher
        run: |
          uv run --locked pyinstaller --noconfirm --workpath build/teacher scripts/classroom.spec
          if ($LASTEXITCODE -ne 0) { throw "Teacher build failed with exit code $LASTEXITCODE" }
      - name: Build student service
        shell: pwsh
        env:
          CLASSROOM_FREEZE_ROLE: LanClassroom-Student-Service
        run: |
          uv run --locked pyinstaller --noconfirm --workpath build/service scripts/classroom.spec
          if ($LASTEXITCODE -ne 0) { throw "Student service build failed with exit code $LASTEXITCODE" }
      - name: Build student session agent
        shell: pwsh
        env:
          CLASSROOM_FREEZE_ROLE: LanClassroom-Student-Agent
        run: |
          uv run --locked pyinstaller --noconfirm --workpath build/agent scripts/classroom.spec
          if ($LASTEXITCODE -ne 0) { throw "Student agent build failed with exit code $LASTEXITCODE" }
      - name: Build installers
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer/teacher.iss
          if ($LASTEXITCODE -ne 0) { throw "Teacher installer build failed with exit code $LASTEXITCODE" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer/student.iss
          if ($LASTEXITCODE -ne 0) { throw "Student installer build failed with exit code $LASTEXITCODE" }
      - name: Verify Windows 7 PE compatibility
        shell: pwsh
        run: |
          uv run --locked python scripts/check_pe_compat.py --maximum-version 6.1 `
            --runtime-directory dist/LanClassroom-Teacher `
            --runtime-directory dist/LanClassroom-Student-Service `
            --runtime-directory dist/LanClassroom-Student-Agent `
            third_party/ultravnc/winvnc.exe `
            third_party/ultravnc/vncviewer.exe `
            dist/LanClassroom-Teacher/LanClassroom-Teacher.exe `
            dist/LanClassroom-Teacher/python38.dll `
            dist/LanClassroom-Teacher/PyQt5/Qt/bin/Qt5Core.dll `
            dist/LanClassroom-Student-Service/LanClassroom-Student-Service.exe `
            dist/LanClassroom-Student-Agent/LanClassroom-Student-Agent.exe `
            dist/installer/LanClassroom-Teacher-Setup.exe `
            dist/installer/LanClassroom-Student-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows 7 PE compatibility check failed with exit code $LASTEXITCODE" }
      - name: Package update archives
        shell: pwsh
        run: |
          Copy-Item "third_party/ultravnc" "dist/LanClassroom-Teacher/UltraVNC" -Recurse -Force
          Compress-Archive -Path "dist/LanClassroom-Teacher/*" -DestinationPath "LanClassroom-Teacher.zip" -Force
          New-Item -ItemType Directory -Force "dist/StudentUpdate/Service","dist/StudentUpdate/Agent" | Out-Null
          Copy-Item "dist/LanClassroom-Student-Service/*" "dist/StudentUpdate/Service" -Recurse -Force
          Copy-Item "dist/LanClassroom-Student-Agent/*" "dist/StudentUpdate/Agent" -Recurse -Force
          Copy-Item "third_party/ultravnc" "dist/StudentUpdate/UltraVNC" -Recurse -Force
          Compress-Archive -Path "dist/StudentUpdate/*" -DestinationPath "LanClassroom-Student.zip" -Force
      - name: Sign update manifests
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          if (-not $env:UPDATE_SIGNING_PRIVATE_KEY_B64) { throw "UPDATE_SIGNING_PRIVATE_KEY_B64 is required" }
          $keyPath = Join-Path $env:RUNNER_TEMP "update-private.pem"
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:UPDATE_SIGNING_PRIVATE_KEY_B64))
          try {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            uv run --locked python scripts/release_manifest.py sign --package LanClassroom-Teacher.zip --version $version --private $keyPath
            if ($LASTEXITCODE -ne 0) { throw "Teacher manifest signing failed with exit code $LASTEXITCODE" }
            uv run --locked python scripts/release_manifest.py sign --package LanClassroom-Student.zip --version $version --private $keyPath
            if ($LASTEXITCODE -ne 0) { throw "Student manifest signing failed with exit code $LASTEXITCODE" }
            # 外层 ZIP 同时携带原始载荷、清单和签名，旧学生端仍接收原始载荷。
            uv run --locked python scripts/release_manifest.py bundle --package LanClassroom-Teacher.zip --output LanClassroom-Teacher-Update.zip
            if ($LASTEXITCODE -ne 0) { throw "Teacher update bundle verification failed" }
            uv run --locked python scripts/release_manifest.py bundle --package LanClassroom-Student.zip --output LanClassroom-Student-Update.zip
            if ($LASTEXITCODE -ne 0) { throw "Student update bundle verification failed" }
            Get-FileHash -Algorithm SHA256 LanClassroom-Teacher-Update.zip,LanClassroom-Student-Update.zip,dist/installer/*.exe | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content SHA256SUMS.txt
          }
          finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }
      - name: Create or update draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            "LanClassroom-Teacher-Update.zip"
            "LanClassroom-Student-Update.zip"
            "dist/installer/LanClassroom-Teacher-Setup.exe"
            "dist/installer/LanClassroom-Student-Setup.exe"
            "SHA256SUMS.txt"
          )

          $isDraft = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            if ($isDraft.Trim() -ne "true") {
              throw "Release $tag is already published; refusing to overwrite its assets"
            }

            gh release upload $tag $assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Draft release asset update failed with exit code $LASTEXITCODE" }
          }
          else {
            $releaseNotes = Get-Content RELEASE.md -Raw -Encoding utf8
            gh release create $tag $assets `
              --draft --generate-notes --verify-tag `
              --title "Release $tag" --notes $releaseNotes
            if ($LASTEXITCODE -ne 0) { throw "Draft release creation failed with exit code $LASTEXITCODE" }
          }
